<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">

    <title>Cementing Accessories</title>
</head>

<body>

    <header class="site-header">
        <h1>Bem-vindo ao Cementing Accessories</h1>
        <p class="intro-text">Seu banco de dados de acessórios de cimentação!</p>
    </header>
    
    <main>
        <div class="main-container">
            <nav class="main-nav" aria-label="Recursos">
                    <ul class="nav-list">
                        <li><button class="nav-item" type="button">Usuários</button></li>
                        <li><button class="nav-item" type="button">Poços</button></li>
                        <li><button class="nav-item" type="button">Acessórios</button></li>
                    </ul>
            </nav>
            <div class="main-create">
                <button class="btn-create" id="createButton" type="button">Criar</button>
            </div>
            <div class="main-content">
                <h2 id="object">Acessórios</h2>
                <section class="form-section" id="formSection" hidden>
                        <form id="resourceForm"></form>
                </section>
                <ul class="item-list" id="mainList">
                    <!-- Itens da lista vão aparecer aqui -->
                </ul>
                <section class="details" id="detailsSection" hidden>
                    <h3 class="detailsTitle" id="detailsTitle">Detalhes</h3>
                    <button class="btn-primary" id="updateButton" type="button">Atualizar</button>
                    <button class="btn-primary" id="analyzeButton" type="button">Analisar</button>
                    <dl class="details-text" id="detailsText"></dl>
                </section>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p class="footer-text">Página em desenvolvimento</p>
    </footer>

    <script src="scripts.js" defer></script>
</body>

</html>
